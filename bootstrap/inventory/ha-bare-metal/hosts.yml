---
# bootstrap/inventory/ha-bare-metal/hosts.yml
#
# Deploy shape: HA bare metal. Three control plane nodes with stacked etcd
# (recommended for clusters <= 50 nodes per kubeadm guidance), plus N
# workers. Full anti-affinity across racks/switches/PSUs as physical layout
# allows. The reference production target.
#
# Selected at run time:
#   ansible-playbook -i inventory/ha-bare-metal/ site.yml

all:
  children:
    control_plane:
      hosts: {}
    workers:
      hosts: {}
