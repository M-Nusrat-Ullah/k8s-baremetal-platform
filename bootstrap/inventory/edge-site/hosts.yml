---
# bootstrap/inventory/edge-site/hosts.yml
#
# Deploy shape: edge site. Small physical footprint at a single location —
# typically one control plane node and one or two workers. No HA; if the
# control plane host dies, the site is down until it's restored. Acceptable
# trade-off for edge deployments where physical replication isn't viable.
#
# Selected at run time:
#   ansible-playbook -i inventory/edge-site/ site.yml

all:
  children:
    control_plane:
      hosts: {}
    workers:
      hosts: {}
