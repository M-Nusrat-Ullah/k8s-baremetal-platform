---
# bootstrap/inventory/hosts.yml
#
# Inventory skeleton for the three deploy shapes locked in ADR-0001 (to land
# later in L1): lab-single-node, edge-site, and ha-bare-metal. Each shape is
# a top-level group with empty hosts; concrete hosts get filled in when a
# real lab or site is provisioned (separate "feat(inventory): populate
# <shape>" commits, not bundled with platform work).
#
# k8s_cluster is a cross-cutting group of groups — playbooks that apply
# cluster-wide (CNI install, kubeadm prep, OS hardening) target it; only
# whichever shape is active at deploy time contributes hosts. Non-K8s hosts
# that appear later (e.g. a standalone HAProxy proxy in L6) live in their
# own top-level group, not inside k8s_cluster.
#
# Empty `hosts: {}` is intentional — declares the group exists without
# populating it. Empty child references (`lab_single_node:` with no value)
# under k8s_cluster.children are the Ansible YAML inventory idiom for
# "include this already-defined group as a child"; the group definition
# lives above.

all:
  children:
    # Deploy shape: single-node lab. One host that runs both control plane
    # and worker workloads (the control-plane taint is removed). Intended
    # for fast iteration on a developer machine.
    lab_single_node:
      hosts: {}

    # Deploy shape: edge site. Small physical footprint — typically one
    # control plane node plus one or two workers at a single location.
    edge_site:
      hosts: {}

    # Deploy shape: HA bare metal. Three control plane nodes with stacked
    # etcd, plus N workers, full anti-affinity. The reference production
    # target.
    ha_bare_metal:
      hosts: {}

    # Cross-cutting: every Kubernetes node, regardless of which deploy
    # shape it belongs to. Targeted by roles that apply to all cluster
    # members.
    k8s_cluster:
      children:
        lab_single_node:
        edge_site:
        ha_bare_metal:
