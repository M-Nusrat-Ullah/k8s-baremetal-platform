---
# bootstrap/inventory/lab-single-node/hosts.yml
#
# Deploy shape: single-node lab. One host runs both control plane and worker
# workloads — the control-plane taint is removed by the bootstrap playbooks so
# pods schedule everywhere. Intended for fast iteration on a developer machine.
#
# The host is a member of BOTH control_plane and workers; connection vars are
# declared once (on the control_plane entry) and apply to the host globally.
# Ansible handles the membership overlap natively.
#
# IMPORTANT: target a dedicated, disposable noble VM — NOT your laptop. os_prep
# disables swap, blacklists kernel modules, masks systemd-timesyncd, and the
# L1.1.7 smoke harness reboots the host.
#
# Connection values are environment-specific. Keep your real VM IP/user local;
# do not commit them to this public repo (edit in place without committing, or
# override via a gitignored host_vars/ file).
#
# Selected at run time:
#   ansible-playbook -i inventory/lab-single-node/ site.yml

all:
  children:
    control_plane:
      hosts:
        lab-node:
          ansible_host: 192.0.2.10 # replace: VM/Machine IP reachable from controller
          ansible_user: ubuntu # replace: SSH user on the VM (must have sudo)
    workers:
      hosts:
        lab-node: {}
