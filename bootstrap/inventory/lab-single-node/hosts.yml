---
# bootstrap/inventory/lab-single-node/hosts.yml
#
# Deploy shape: single-node lab. One host that runs both control plane and
# worker workloads — the control-plane taint is removed by the bootstrap
# playbooks so pods schedule everywhere. Intended for fast iteration on a
# developer machine.
#
# When populating: add the single host to BOTH the control_plane and
# workers groups. Same host, two roles — Ansible handles the membership
# overlap natively.
#
# Selected at run time:
#   ansible-playbook -i inventory/lab-single-node/ site.yml

all:
  children:
    control_plane:
      hosts: {}
    workers:
      hosts: {}
