# bootstrap/site.yml
---
# bootstrap/site.yml
#
# Top-level orchestration playbook for the bootstrap layer.
#
#   Play 1 (trust)        — pin each host's SSH key on first contact, then
#                           verify reachability with a no-op ping.
#   Play 2 (node baseline)— apply the os_prep role to every host. Further
#                           roles get wired in here as separate plays (L1.1+).
#
# Host-key handling rationale:
#   * ansible.cfg sets host_key_checking=True globally. Every connection
#     after first-touch is verified against ~/.ssh/known_hosts; mid-flight
#     key changes fail the play loudly.
#   * StrictHostKeyChecking=accept-new lets first-time-seen hosts auto-pin
#     their keys on the initial run without weakening strictness for known
#     hosts. OpenSSH-recommended bootstrap pattern (>= 7.6; noble ships 9.x).
#   * Net effect: trust-on-first-use for fresh hosts, strict thereafter.
#     Play 1 owns trust establishment and must run before Play 2, which
#     connects under the global strict policy (no accept-new of its own).
#
# Run:
#   ansible-playbook -i inventory/lab-single-node/ site.yml --check   # dry-run
#   ansible-playbook -i inventory/lab-single-node/ site.yml           # apply
#   ansible-playbook -i inventory/lab-single-node/ site.yml --tags swap

- name: Establish controller trust and verify host reachability
  hosts: all
  gather_facts: false
  vars:
    ansible_ssh_extra_args: "-o StrictHostKeyChecking=accept-new"

  tasks:
    - name: Verify reachability from the controller
      ansible.builtin.ping:

- name: Prepare node OS baseline (os_prep)
  hosts: all
  become: true
  # os_prep gates tasks on swap state and container detection, both sourced
  # from gathered facts (swaptotal_mb, virtualization_type), so facts are
  # required here even though the trust play above runs factless.
  gather_facts: true
  roles:
    - role: os_prep
