# bootstrap/ansible.cfg
#
# Production-grade Ansible configuration for the k8s-baremetal-platform
# bootstrap layer. Run ansible commands from this directory (or set
# ANSIBLE_CONFIG=$(pwd)/bootstrap/ansible.cfg) so this file is picked up.
#
# Rationale for the knobs below is recorded in docs/adr/0004-ansible-tooling.md
# (lands later in L1). Any change here ships with an ADR update.

[defaults]

# --- Layout ----------------------------------------------------------------
# Paths are relative to this file's directory.

inventory               = ./inventory
roles_path              = ./roles
collections_path        = ./collections
playbook_dir            = .

# --- Output ----------------------------------------------------------------
# YAML-formatted task output via the built-in `default` callback. The
# dedicated `community.general.yaml` callback was removed in community.general
# v12.0.0; `result_format=yaml` on the default callback is the supported path
# since ansible-core 2.13.

stdout_callback         = default
callback_result_format  = yaml
bin_ansible_callbacks   = True
nocows                  = True

# --- Fact gathering --------------------------------------------------------
# `smart` gathers facts once per playbook run; `memory` keeps them only for
# that run. No disk-backed cache during bootstrap — stale facts are a worse
# debug experience than a few extra seconds of gather_facts.

gathering               = smart
fact_caching            = memory

# --- Execution -------------------------------------------------------------

forks                   = 10
host_key_checking       = True
deprecation_warnings    = True
retry_files_enabled     = False
interpreter_python      = auto_silent

# --- Privilege escalation --------------------------------------------------
# Plays opt in to `become` per-task or per-play; no implicit cluster-wide
# root. become_ask_pass=False assumes passwordless sudo is configured on
# target hosts (documented as a host prerequisite in the README).

[privilege_escalation]

become                  = False
become_method           = sudo
become_user             = root
become_ask_pass         = False

# --- SSH transport ---------------------------------------------------------
# Pipelining + persistent control sockets give 3-5x speedup on multi-task
# plays. ControlPersist is short enough that a stale connection won't
# outlast a typical edit-test cycle but long enough to amortize across a
# play.

[ssh_connection]

pipelining              = True
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
control_path_dir        = ~/.ansible/cp
transfer_method         = smart
retries                 = 3

# --- Inventory -------------------------------------------------------------
# Fail loudly on inventory parse errors rather than silently dropping hosts.
# YAML is first-class; INI kept for ad-hoc fixtures.

[inventory]

enable_plugins          = host_list, yaml, ini, auto
unparsed_is_failed      = True
