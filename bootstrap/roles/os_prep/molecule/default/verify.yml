---
# Molecule verification for the os_prep role. Assertions accrue per slice
# (L1.1.x); this replaces the L1.1.0 fail-loud stub. Each slice proves
# artifact content here; idempotence is proven by the `molecule idempotence`
# step (a second converge reporting changed=0), not asserted in this file.
- name: Verify
  hosts: all
  gather_facts: true
  vars_files:
    - ../../defaults/main.yml
  tasks:
    # --- swap (L1.1.1) ------------------------------------------------------
    - name: Verify | read /etc/fstab
      ansible.builtin.slurp:
        src: /etc/fstab
      register: os_prep_fstab

    - name: Verify | no uncommented swap entry remains in /etc/fstab
      ansible.builtin.assert:
        that:
          # Active swap = an uncommented line whose 3rd whitespace field is
          # exactly "swap". Column-anchored, so /swapdata mount points and
          # "swap"-containing option strings don't false-match.
          - >-
            (os_prep_fstab.content | b64decode).splitlines()
            | map('trim')
            | reject('match', '^#')
            | select('match', '^\S+\s+\S+\s+swap(\s|$)')
            | list | length == 0
        fail_msg: "Uncommented swap entry still present in /etc/fstab."
        success_msg: "No active swap entries in /etc/fstab."

    - name: Verify | non-swap lines containing "swap" remain uncommented
      ansible.builtin.assert:
        that:
          # Both decoys (/swapdata mount point; swapfoo option string) must
          # still be present and uncommented. If the regex over-matched on
          # the "swap" substring, these would be commented and the count
          # would drop below 2. Proves column-anchoring, not just absence.
          - >-
            (os_prep_fstab.content | b64decode).splitlines()
            | map('trim')
            | reject('match', '^#')
            | select('search', 'swap')
            | list | length == 2
        fail_msg: >-
          A non-swap line containing "swap" was wrongly commented; the
          fstype-column anchor failed.
        success_msg: "Swap-lookalike lines correctly left untouched."

    - name: Verify | runtime swap is fully disabled
      ansible.builtin.assert:
        that:
          - ansible_facts['swaptotal_mb'] | default(0) | int == 0
        fail_msg: >-
          swaptotal_mb={{ ansible_facts['swaptotal_mb'] | default('undef') }};
          runtime swap still active.
        success_msg: "Runtime swap total is 0."
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    # --- kernel modules (L1.1.2) --------------------------------------------
    - name: Verify | stat /etc/modules-load.d/k8s.conf
      ansible.builtin.stat:
        path: /etc/modules-load.d/k8s.conf
      register: os_prep_modules_file

    - name: Verify | modules-load file exists and is mode 0644
      ansible.builtin.assert:
        that:
          - os_prep_modules_file.stat.exists
          - os_prep_modules_file.stat.mode == "0644"
        fail_msg: "/etc/modules-load.d/k8s.conf missing or not mode 0644."
        success_msg: "/etc/modules-load.d/k8s.conf present, mode 0644."

    - name: Verify | read /etc/modules-load.d/k8s.conf
      ansible.builtin.slurp:
        src: /etc/modules-load.d/k8s.conf
      register: os_prep_modules_conf

    - name: Verify | modules-load file lists every required module
      ansible.builtin.assert:
        that:
          - item in (os_prep_modules_conf.content | b64decode)
        fail_msg: "{{ item }} absent from /etc/modules-load.d/k8s.conf."
        success_msg: "{{ item }} present in /etc/modules-load.d/k8s.conf."
      loop: "{{ os_prep_kernel_modules }}"

    # Real-kernel checks: /proc/modules only reflects modprobe, which is guarded
    # out of containers. These skip under molecule and run during real site.yml
    # execution (and the deferred L1.1.7 reboot smoke test).
    - name: Verify | read /proc/modules from the running kernel
      ansible.builtin.command: cat /proc/modules
      register: os_prep_proc_modules
      changed_when: false
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    - name: Verify | every required module is loaded in the running kernel
      ansible.builtin.assert:
        that:
          - (item ~ ' ') in os_prep_proc_modules.stdout
        fail_msg: "{{ item }} is not loaded (absent from /proc/modules)."
        success_msg: "{{ item }} is loaded in the running kernel."
      loop: "{{ os_prep_kernel_modules }}"
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    # --- sysctl (L1.1.3) ----------------------------------------------------
    - name: Verify | stat the sysctl drop-in
      ansible.builtin.stat:
        path: "{{ os_prep_sysctl_file }}"
      register: os_prep_sysctl_file_stat

    # Mode is intentionally NOT asserted: ansible.posix.sysctl owns this file
    # and exposes no mode option (unlike the kernel_modules template, which
    # sets 0644 itself). We assert what we control: existence and content.
    - name: Verify | sysctl drop-in exists
      ansible.builtin.assert:
        that:
          - os_prep_sysctl_file_stat.stat.exists
        fail_msg: "{{ os_prep_sysctl_file }} does not exist."
        success_msg: "{{ os_prep_sysctl_file }} present."

    - name: Verify | read the sysctl drop-in
      ansible.builtin.slurp:
        src: "{{ os_prep_sysctl_file }}"
      register: os_prep_sysctl_conf

    - name: Verify | drop-in persists every required key with its value
      ansible.builtin.assert:
        that:
          # Spacing-tolerant (\s*=\s*) and anchored. regex_escape on the key
          # because the dots would otherwise match any character. length == 1
          # also catches a duplicated line.
          - >-
            (os_prep_sysctl_conf.content | b64decode).splitlines()
            | map('trim')
            | select('match', '^' ~ (item.key | regex_escape) ~ '\s*=\s*' ~ (item.value | regex_escape) ~ '$')
            | list | length == 1
        fail_msg: "{{ item.key }} = {{ item.value }} not found exactly once in {{ os_prep_sysctl_file }}."
        success_msg: "{{ item.key }} = {{ item.value }} present in {{ os_prep_sysctl_file }}."
      loop: "{{ os_prep_sysctl_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # Real-kernel checks: live /proc/sys values only reflect the guarded set +
    # reload, which is skipped in containers (and the net.bridge.* keys do not
    # exist there without br_netfilter). These skip under Molecule and run
    # during real site.yml execution and the deferred L1.1.7 reboot smoke test.
    - name: Verify | read live sysctl values from /proc/sys
      ansible.builtin.slurp:
        src: "/proc/sys/{{ item.key | replace('.', '/') }}"
      register: os_prep_sysctl_live
      loop: "{{ os_prep_sysctl_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    - name: Verify | every required sysctl is live in the running kernel
      ansible.builtin.assert:
        that:
          - (item.content | b64decode | trim) == item.item.value
        fail_msg: >-
          {{ item.item.key }} is {{ item.content | b64decode | trim }}
          in /proc/sys, expected {{ item.item.value }}.
        success_msg: "{{ item.item.key }} is {{ item.item.value }} in the running kernel."
      loop: "{{ os_prep_sysctl_live.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']
