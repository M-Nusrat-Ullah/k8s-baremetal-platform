---
# Molecule verification for the os_prep role. Assertions accrue per slice
# (L1.1.x); this replaces the L1.1.0 fail-loud stub. Each slice proves
# artifact content here; idempotence is proven by the `molecule idempotence`
# step (a second converge reporting changed=0), not asserted in this file.
- name: Verify
  hosts: all
  gather_facts: true
  vars_files:
    - ../../defaults/main.yml
  tasks:
    # --- swap (L1.1.1) ------------------------------------------------------
    - name: Verify | read /etc/fstab
      ansible.builtin.slurp:
        src: /etc/fstab
      register: os_prep_fstab

    - name: Verify | no uncommented swap entry remains in /etc/fstab
      ansible.builtin.assert:
        that:
          # Active swap = an uncommented line whose 3rd whitespace field is
          # exactly "swap". Column-anchored, so /swapdata mount points and
          # "swap"-containing option strings don't false-match.
          - >-
            (os_prep_fstab.content | b64decode).splitlines()
            | map('trim')
            | reject('match', '^#')
            | select('match', '^\S+\s+\S+\s+swap(\s|$)')
            | list | length == 0
        fail_msg: "Uncommented swap entry still present in /etc/fstab."
        success_msg: "No active swap entries in /etc/fstab."

    - name: Verify | non-swap lines containing "swap" remain uncommented
      ansible.builtin.assert:
        that:
          # Both decoys (/swapdata mount point; swapfoo option string) must
          # still be present and uncommented. If the regex over-matched on
          # the "swap" substring, these would be commented and the count
          # would drop below 2. Proves column-anchoring, not just absence.
          - >-
            (os_prep_fstab.content | b64decode).splitlines()
            | map('trim')
            | reject('match', '^#')
            | select('search', 'swap')
            | list | length == 2
        fail_msg: >-
          A non-swap line containing "swap" was wrongly commented; the
          fstype-column anchor failed.
        success_msg: "Swap-lookalike lines correctly left untouched."

    - name: Verify | runtime swap is fully disabled
      ansible.builtin.assert:
        that:
          - ansible_facts['swaptotal_mb'] | default(0) | int == 0
        fail_msg: >-
          swaptotal_mb={{ ansible_facts['swaptotal_mb'] | default('undef') }};
          runtime swap still active.
        success_msg: "Runtime swap total is 0."
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    # --- kernel modules (L1.1.2) --------------------------------------------
    - name: Verify | stat /etc/modules-load.d/k8s.conf
      ansible.builtin.stat:
        path: /etc/modules-load.d/k8s.conf
      register: os_prep_modules_file

    - name: Verify | modules-load file exists and is mode 0644
      ansible.builtin.assert:
        that:
          - os_prep_modules_file.stat.exists
          - os_prep_modules_file.stat.mode == "0644"
        fail_msg: "/etc/modules-load.d/k8s.conf missing or not mode 0644."
        success_msg: "/etc/modules-load.d/k8s.conf present, mode 0644."

    - name: Verify | read /etc/modules-load.d/k8s.conf
      ansible.builtin.slurp:
        src: /etc/modules-load.d/k8s.conf
      register: os_prep_modules_conf

    - name: Verify | modules-load file lists every required module
      ansible.builtin.assert:
        that:
          - item in (os_prep_modules_conf.content | b64decode)
        fail_msg: "{{ item }} absent from /etc/modules-load.d/k8s.conf."
        success_msg: "{{ item }} present in /etc/modules-load.d/k8s.conf."
      loop: "{{ os_prep_kernel_modules }}"

    # Real-kernel checks: /proc/modules only reflects modprobe, which is guarded
    # out of containers. These skip under molecule and run during real site.yml
    # execution (and the deferred L1.1.7 reboot smoke test).
    - name: Verify | read /proc/modules from the running kernel
      ansible.builtin.command: cat /proc/modules
      register: os_prep_proc_modules
      changed_when: false
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    - name: Verify | every required module is loaded in the running kernel
      ansible.builtin.assert:
        that:
          - (item ~ ' ') in os_prep_proc_modules.stdout
        fail_msg: "{{ item }} is not loaded (absent from /proc/modules)."
        success_msg: "{{ item }} is loaded in the running kernel."
      loop: "{{ os_prep_kernel_modules }}"
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    # --- sysctl (L1.1.3) ----------------------------------------------------
    - name: Verify | stat the sysctl drop-in
      ansible.builtin.stat:
        path: "{{ os_prep_sysctl_file }}"
      register: os_prep_sysctl_file_stat

    # Mode is intentionally NOT asserted: ansible.posix.sysctl owns this file
    # and exposes no mode option (unlike the kernel_modules template, which
    # sets 0644 itself). We assert what we control: existence and content.
    - name: Verify | sysctl drop-in exists
      ansible.builtin.assert:
        that:
          - os_prep_sysctl_file_stat.stat.exists
        fail_msg: "{{ os_prep_sysctl_file }} does not exist."
        success_msg: "{{ os_prep_sysctl_file }} present."

    - name: Verify | read the sysctl drop-in
      ansible.builtin.slurp:
        src: "{{ os_prep_sysctl_file }}"
      register: os_prep_sysctl_conf

    - name: Verify | drop-in persists every required key with its value
      ansible.builtin.assert:
        that:
          # Spacing-tolerant (\s*=\s*) and anchored. regex_escape on the key
          # because the dots would otherwise match any character. length == 1
          # also catches a duplicated line.
          - >-
            (os_prep_sysctl_conf.content | b64decode).splitlines()
            | map('trim')
            | select('match', '^' ~ (item.key | regex_escape) ~ '\s*=\s*' ~ (item.value | regex_escape) ~ '$')
            | list | length == 1
        fail_msg: "{{ item.key }} = {{ item.value }} not found exactly once in {{ os_prep_sysctl_file }}."
        success_msg: "{{ item.key }} = {{ item.value }} present in {{ os_prep_sysctl_file }}."
      loop: "{{ os_prep_sysctl_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # Real-kernel checks: live /proc/sys values only reflect the guarded set +
    # reload, which is skipped in containers (and the net.bridge.* keys do not
    # exist there without br_netfilter). These skip under Molecule and run
    # during real site.yml execution and the deferred L1.1.7 reboot smoke test.
    - name: Verify | read live sysctl values from /proc/sys
      ansible.builtin.slurp:
        src: "/proc/sys/{{ item.key | replace('.', '/') }}"
      register: os_prep_sysctl_live
      loop: "{{ os_prep_sysctl_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    - name: Verify | every required sysctl is live in the running kernel
      ansible.builtin.assert:
        that:
          - (item.content | b64decode | trim) == item.item.value
        fail_msg: >-
          {{ item.item.key }} is {{ item.content | b64decode | trim }}
          in /proc/sys, expected {{ item.item.value }}.
        success_msg: "{{ item.item.key }} is {{ item.item.value }} in the running kernel."
      loop: "{{ os_prep_sysctl_live.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    # --- chrony (L1.1.4) ----------------------------------------------------
    - name: Verify | gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify | chrony package is installed
      ansible.builtin.assert:
        that:
          - "'chrony' in ansible_facts.packages"
        fail_msg: "chrony package is not installed."
        success_msg: "chrony package is installed."

    - name: Verify | stat the chrony config file
      ansible.builtin.stat:
        path: "{{ os_prep_chrony_conf_file }}"
      register: os_prep_chrony_conf_stat

    # Unlike the sysctl drop-in (ansible.posix.sysctl owns it, no mode option),
    # we render this file via template and set mode ourselves, so mode IS
    # asserted here — mirrors the kernel_modules file check.
    - name: Verify | chrony config exists and is mode 0644
      ansible.builtin.assert:
        that:
          - os_prep_chrony_conf_stat.stat.exists
          - os_prep_chrony_conf_stat.stat.mode == "0644"
        fail_msg: "{{ os_prep_chrony_conf_file }} missing or not mode 0644."
        success_msg: "{{ os_prep_chrony_conf_file }} present, mode 0644."

    - name: Verify | read the chrony config
      ansible.builtin.slurp:
        src: "{{ os_prep_chrony_conf_file }}"
      register: os_prep_chrony_conf

    - name: Verify | every configured time source is present exactly once
      ansible.builtin.assert:
        that:
          # Each os_prep_chrony_servers entry renders as one
          # "<type> <address> iburst" line. regex_escape on address (dots);
          # anchored + length == 1 also catches a duplicated source.
          - >-
            (os_prep_chrony_conf.content | b64decode).splitlines()
            | map('trim')
            | select('match', '^' ~ (item.type | regex_escape) ~ '\s+' ~ (item.address | regex_escape) ~ '\s+iburst$')
            | list | length == 1
        fail_msg: "{{ item.type }} {{ item.address }} iburst not found exactly once in {{ os_prep_chrony_conf_file }}."
        success_msg: "{{ item.type }} {{ item.address }} iburst present once."
      loop: "{{ os_prep_chrony_servers }}"
      loop_control:
        label: "{{ item.address }}"

    - name: Verify | required baseline directives are present exactly once
      ansible.builtin.assert:
        that:
          # The non-source directives the slice owns. Asserted as literal
          # anchored lines so a template edit that drops or mangles one (e.g.
          # removing driftfile, the reason chrony is used here) fails the build.
          # regex_escape handles the dots/slashes in the values.
          - >-
            (os_prep_chrony_conf.content | b64decode).splitlines()
            | map('trim')
            | select('match', '^' ~ (item | regex_escape) ~ '$')
            | list | length == 1
        fail_msg: "Expected chrony directive '{{ item }}' not found exactly once."
        success_msg: "chrony directive '{{ item }}' present once."
      loop:
        - driftfile /var/lib/chrony/chrony.drift
        - makestep 1.0 3
        - rtcsync

    - name: Verify | no include directive reintroduces external sources
      ansible.builtin.assert:
        that:
          # ADR-0010: the file owns its sources. An uncommented confdir/
          # sourcedir/include would pull the distro's sources.d/conf.d back in,
          # silently un-inerting ubuntu-ntp-pools.sources. Guard the decision.
          - >-
            (os_prep_chrony_conf.content | b64decode).splitlines()
            | map('trim')
            | reject('match', '^#')
            | select('match', '^(confdir|sourcedir|include|includedir)\s')
            | list | length == 0
        fail_msg: "An include directive is present; chrony.conf no longer owns its sources (ADR-0010)."
        success_msg: "No include directives; os_prep_chrony_servers is authoritative."

    # Real-service checks: unit state and the timesyncd mask are live systemd
    # actions, guarded out of containers (the mask/enable/start tasks skip under
    # Molecule). These skip here and run during real site.yml execution and the
    # deferred L1.1.7 smoke test. Actual sync (chronyc tracking) is network- and
    # time-dependent, so it is left to the L1.1.7 smoke test, not asserted here.
    - name: Verify | gather service facts
      ansible.builtin.service_facts:
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    - name: Verify | chrony is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['chrony.service'].state == 'running'
          - ansible_facts.services['chrony.service'].status == 'enabled'
        fail_msg: "chrony.service is not running and enabled."
        success_msg: "chrony.service is running and enabled."
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    - name: Verify | stat the systemd-timesyncd mask symlink
      ansible.builtin.stat:
        path: /etc/systemd/system/systemd-timesyncd.service
      register: os_prep_timesyncd_mask
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    - name: Verify | systemd-timesyncd is masked (symlink to /dev/null)
      ansible.builtin.assert:
        that:
          - os_prep_timesyncd_mask.stat.exists
          - os_prep_timesyncd_mask.stat.islnk
          - os_prep_timesyncd_mask.stat.lnk_target == '/dev/null'
        fail_msg: "systemd-timesyncd is not masked; it could race chrony for the clock."
        success_msg: "systemd-timesyncd is masked (symlink to /dev/null)."
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    # --- AppArmor (L1.1.5) --------------------------------------------------
    # Reuses ansible_facts.packages from the chrony package_facts gather above.
    - name: Verify | every required AppArmor package is installed
      ansible.builtin.assert:
        that:
          - item in ansible_facts.packages
        fail_msg: "{{ item }} is not installed."
        success_msg: "{{ item }} is installed."
      loop: "{{ os_prep_apparmor_packages }}"

    # Real-kernel check: /sys/module/apparmor/parameters/enabled reflects the
    # host kernel, so under Molecule it would assert the Docker host, not the
    # role. Guarded out here (the tasks/apparmor.yml preflight is likewise
    # guarded) and exercised during real site.yml execution and the L1.1.7
    # smoke test. Independent re-assertion, mirroring the /proc/modules check.
    - name: Verify | read the AppArmor LSM enabled flag from the running kernel
      ansible.builtin.slurp:
        src: /sys/module/apparmor/parameters/enabled
      register: os_prep_apparmor_enabled_check
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']

    - name: Verify | AppArmor LSM is enabled in the running kernel
      ansible.builtin.assert:
        that:
          - (os_prep_apparmor_enabled_check.content | b64decode | trim) == "Y"
        fail_msg: "AppArmor LSM is not enabled (/sys/module/apparmor/parameters/enabled != 'Y')."
        success_msg: "AppArmor LSM is enabled in the running kernel."
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container', 'containerd']
