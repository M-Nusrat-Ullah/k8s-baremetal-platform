---
# Default variables for the os_prep role.
#
# Override from inventory group_vars, host_vars, or play vars. This file
# is the role's public configuration surface; the README's variables table
# is authoritative for what each variable does.

# --- swap (L1.1.1) ----------------------------------------------------------
# Disable swap on the node. Required for the default kubelet posture
# (failSwapOn: true, NodeSwap off). Set false ONLY on a node you have
# deliberately configured for NodeSwap. See docs/adr/0005.
# Variables are appended per L1.1.x slice.
os_prep_swap_disable: true

# --- Kernel modules -------------------------------------------------------
# Kernel modules required by the container runtime (containerd) and kubeadm,
# loaded at boot via /etc/modules-load.d/k8s.conf and into the running kernel
# via modprobe.
#
# This is the node-prerequisite set ONLY. Do NOT add workload-specific modules
# here (e.g. xfrm/IPsec for a SecGW, DPDK, conntrack tuning for a UPF). Those
# belong to the workload that needs them and must be tracked in that workload's
# PRIVILEGED_EXCEPTIONS entry -- not loaded on every node by os_prep.
#
#   overlay       containerd overlayfs snapshotter
#   br_netfilter  creates the net.bridge.bridge-nf-call-* sysctl keys (set in
#                 the L1.1.3 sysctl slice) and satisfies the kubeadm preflight
#                 check. NOT required by Cilium's eBPF datapath -- see ADR-0007.
os_prep_kernel_modules:
  - overlay
  - br_netfilter

# --- sysctl (L1.1.3) --------------------------------------------------------
# Kernel sysctls required by the Kubernetes node baseline, written to a single
# drop-in (os_prep_sysctl_file) and applied to the running kernel on real
# hosts. The 99- prefix applies the drop-in after the distribution defaults in
# /usr/lib/sysctl.d/, so it wins on any overlapping key.
#
# This is the node-prerequisite set ONLY. Do NOT add workload- or CNI-managed
# sysctls here:
#   * rp_filter is deliberately omitted. Cilium relaxes rp_filter on its own
#     interfaces itself; setting net.*.conf.all.rp_filter=0 here would be a
#     host-wide reverse-path-filtering downgrade, broader than Cilium asks for.
#   * IPv6 forwarding is omitted: this platform is IPv4-only. Add
#     net.ipv6.conf.all.forwarding=1 only when going dual-stack.
#   * Node-tuning sysctls (fs.inotify.*, etc.) are not node prerequisites.
# See docs/adr/0009 for the full rationale.
#
#   net.ipv4.ip_forward                  Load-bearing: required for pod and
#                                        cross-node routing, and still enforced
#                                        by the kubeadm preflight check on 1.34.
#   net.bridge.bridge-nf-call-iptables   Conventional baseline; inert under the
#   net.bridge.bridge-nf-call-ip6tables  Cilium eBPF datapath. Requires
#                                        br_netfilter (L1.1.2), which is why the
#                                        kernel_modules import is ordered first.
#                                        See docs/adr/0007.
os_prep_sysctl_settings:
  net.ipv4.ip_forward: "1"
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"

# Single sysctl drop-in, managed by ansible.posix.sysctl (ADR-0004 mandates the
# module over a hand-rolled file + `sysctl -p`). 99- prefix: see note above.
os_prep_sysctl_file: /etc/sysctl.d/99-k8s.conf

# --- chrony (L1.1.4) --------------------------------------------------------
# Time synchronization for the node, provided by chrony. Disciplined, agreed
# time is a Kubernetes correctness prerequisite, not a nicety: TLS certificate
# validity windows, etcd lease/Raft timing, and kubelet<->apiserver token auth
# all assume node clocks agree. chrony is chosen over the noble default
# (systemd-timesyncd) for drift-file discipline across upstream outages (an
# edge-site reality, where an SNTP client just stops correcting) and the
# ability to serve peers in an isolated site. See docs/adr/0010 for the
# chrony-vs-timesyncd rationale and the conflict-handling decision
# (systemd-timesyncd is stopped, disabled, and masked so the two never race).
#
# os_prep_chrony_servers is this slice's source of truth: the upstream NTP
# sources, each rendered as one "<type> <address> iburst" line in the
# chrony.conf template. The public NTP Pool default exists only so a fresh
# node syncs at all; it is NOT a production value. Override it from group_vars/
# host_vars with your site or internal NTP servers (type: server) for
# production, edge, and air-gapped deployments, where reaching the public pool
# is undesirable or impossible.
#
#   type     "pool" (one name resolving to many servers, for public pools) or
#            "server" (a single host, typical for internal/site NTP).
#   address  hostname or IP of the source.
os_prep_chrony_servers:
  - type: pool
    address: pool.ntp.org

# Path to the chrony config file. Fixed by Ubuntu/Debian packaging (RHEL uses
# /etc/chrony.conf); single-sourced here so the template and the Molecule
# assertions reference one value, mirroring os_prep_sysctl_file.
os_prep_chrony_conf_file: /etc/chrony/chrony.conf

# --- AppArmor (L1.1.5) ------------------------------------------------------
# AppArmor packages ensured present on the node. AppArmor is Ubuntu's default
# LSM and a Kubernetes node prerequisite: the kubelet refuses to admit a Pod
# that requests an AppArmor profile unless the AppArmor kernel module is
# enabled (k8s AppArmor support is stable as of 1.31). On noble AppArmor is
# installed and baked into the kernel by default, so this list mainly
# guarantees the baseline on a minimized image where the packages could be
# absent; on a stock node the install is a no-op.
#
#   apparmor        Core: the LSM userspace, apparmor_parser, the profile-load
#                   service, and the default profiles that ship with it.
#   apparmor-utils  Operator/management tooling (aa-enforce, aa-complain,
#                   aa-genprof, aa-logprof, ...). Not strictly required for the
#                   kernel-module prerequisite, but kept so the node carries the
#                   AppArmor tooling for incident response without needing apt
#                   on a possibly air-gapped host.
#
# This slice deliberately does NOT manage the apparmor.service unit (a oneshot
# profile loader that is inactive by design once it has run), modify the kernel
# command line, or author/flip AppArmor profiles. It ensures these packages
# and, on real hosts only, preflight-asserts the LSM is enabled. The authoritative
# check is /sys/module/apparmor/parameters/enabled == Y. See docs/adr/0011.
os_prep_apparmor_packages:
  - apparmor
  - apparmor-utils
