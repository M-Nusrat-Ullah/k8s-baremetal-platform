---
# os_prep — OS-level preparation for Kubernetes nodes.
#
# Per-area task files are imported here with tags. Each task file owns one
# concern; this dispatcher keeps the role flat and the tag surface explicit.
#
# Selective execution:
#   ansible-playbook site.yml --tags sysctl
#   ansible-playbook site.yml --tags kernel,sysctl
#   ansible-playbook site.yml --skip-tags chrony
# import_tasks blocks are added per L1.1.x slice as each task file lands.

- name: Disable swap (kubelet failSwapOn prerequisite)
  ansible.builtin.import_tasks: swap.yml
  tags:
    - swap

# br_netfilter must be loaded before the L1.1.3 sysctl slice sets
# net.bridge.bridge-nf-call-*; that key does not exist until the module is
# loaded. Keep this import ABOVE any sysctl import. Do not reorder.
- name: Configure required kernel modules
  ansible.builtin.import_tasks: kernel_modules.yml
  tags:
    - kernel

# Ordering: this import MUST stay below the kernel_modules import above.
# br_netfilter (loaded there) creates the net.bridge.bridge-nf-call-* keys this
# slice sets; they do not exist in /proc/sys until the module is loaded. See
# the do-not-reorder note above the kernel_modules import.
- name: Apply Kubernetes-required sysctl values
  ansible.builtin.import_tasks: sysctl.yml
  tags:
    - sysctl
