---
# os_prep — OS-level preparation for Kubernetes nodes.
#
# Per-area task files are imported here with tags. Each task file owns one
# concern; this dispatcher keeps the role flat and the tag surface explicit.
#
# Selective execution:
#   ansible-playbook site.yml --tags sysctl
#   ansible-playbook site.yml --tags kernel,sysctl
#   ansible-playbook site.yml --skip-tags chrony
# import_tasks blocks are added per L1.1.x slice as each task file lands.

- name: Disable swap (kubelet failSwapOn prerequisite)
  ansible.builtin.import_tasks: swap.yml
  tags:
    - swap

# br_netfilter must be loaded before the L1.1.3 sysctl slice sets
# net.bridge.bridge-nf-call-*; that key does not exist until the module is
# loaded. Keep this import ABOVE any sysctl import. Do not reorder.
- name: Configure required kernel modules
  ansible.builtin.import_tasks: kernel_modules.yml
  tags:
    - kernel

# Ordering: this import MUST stay below the kernel_modules import above.
# br_netfilter (loaded there) creates the net.bridge.bridge-nf-call-* keys this
# slice sets; they do not exist in /proc/sys until the module is loaded. See
# the do-not-reorder note above the kernel_modules import.
- name: Apply Kubernetes-required sysctl values
  ansible.builtin.import_tasks: sysctl.yml
  tags:
    - sysctl

# chrony has no ordering relationship to the slices above: time sync neither
# depends on the kernel modules / sysctls nor is depended on by them. Ordered
# last by slice number (L1.1.4), not by any constraint -- safe to run alone:
#   ansible-playbook site.yml --tags chrony
- name: Configure time synchronization (chrony)
  ansible.builtin.import_tasks: chrony.yml
  tags:
    - chrony

# apparmor is independent of every slice above: it neither depends on the
# kernel modules / sysctls / chrony nor is depended on by them. Ordered last by
# slice number (L1.1.5), not by any constraint -- safe to run alone:
#   ansible-playbook site.yml --tags apparmor
- name: Ensure AppArmor baseline (Kubernetes node prerequisite)
  ansible.builtin.import_tasks: apparmor.yml
  tags:
    - apparmor

# cis_modules is independent of every slice above (it neither depends on nor is
# depended on by swap/kernel/sysctl/chrony/apparmor) -- safe to run alone:
#   ansible-playbook site.yml --tags cis
# Its blacklist set MUST stay disjoint from the kernel_modules load set above; the
# verify.yml disjoint-set assertion enforces this (docs/adr/0007).
- name: Blacklist unused filesystem kernel modules (CIS 1.1.1)
  ansible.builtin.import_tasks: cis_modules.yml
  tags:
    - cis
