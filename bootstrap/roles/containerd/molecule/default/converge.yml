---
# Converge play: apply the containerd role to the molecule instance.
#
# group_vars/all/versions.yml is NOT auto-loaded from this scenario directory,
# so it is loaded explicitly via vars_files (four ../ climb to bootstrap/).
# This is the same pattern as the collections_path in molecule.yml, and keeps
# group_vars/all/versions.yml as the single source of truth for all version
# pins (containerd.version, containerd.sandbox_image, cni_plugins.*) consumed
# by the role's tasks.
#
# No prepare.yml: unlike os_prep (which seeds /etc/fstab swap fixtures because
# the base image has none), this role's config transform runs against the output
# of `containerd config default` generated by the real binary at converge time.
# The apt install also lays down the Docker .deb's CRI-disabled config.toml
# (disabled_plugins = ["cri"]) — the exact adversarial input the role must
# overwrite — so no fixture seeding is required. The verify assertions prove the
# overwrite succeeded.
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../../../../group_vars/all/versions.yml
  pre_tasks:
    - name: Converge | show detected virtualization type (confirms service guard)
      ansible.builtin.debug:
        var: ansible_facts['virtualization_type']

    # ansible.builtin.deb822_repository requires python3-debian on the target.
    # The geerlingguy noble image does not ship it; install before the role runs.
    # Real hosts will have it (Ubuntu 24.04 noble includes python3-debian in the
    # default install); this pre-task is Molecule scaffolding, not a role concern.
    - name: Converge | ensure python3-debian is present (deb822_repository dependency)
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true
  roles:
    - role: containerd
