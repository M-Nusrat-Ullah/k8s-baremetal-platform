---
# Metadata for the containerd role. Consumed by ansible-galaxy tooling and by
# any future roles that declare dependencies on this one. Galaxy publication
# is not currently planned; fields are populated for forward compatibility
# and self-documentation.
galaxy_info:
  role_name: containerd
  namespace: k8s_baremetal_platform
  author: M Nusrat Ullah
  description: >-
    containerd 2.x container runtime for Kubernetes nodes: pinned install from
    the Docker apt repository, a CRI config generated from the runtime's own
    default with the systemd cgroup driver and a pinned sandbox image, and the
    base CNI plugins. The install method is a seam for future binary and
    air-gapped paths. Idempotent; safe to re-run on existing nodes.
  license: Apache-2.0
  min_ansible_version: "2.20"
  platforms:
    - name: Ubuntu
      versions:
        - noble # 24.04 LTS only — see role README for scope rationale
  galaxy_tags:
    - kubernetes
    - bootstrap
    - containerd
    - cri
dependencies: []
