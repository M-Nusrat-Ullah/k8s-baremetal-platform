---
# bootstrap/roles/kube_bootstrap/tasks/init.yml
#
# Runs kubeadm init on the first control-plane node.
#
# Idempotency: guarded by the presence of /etc/kubernetes/admin.conf.
# If that file exists, kubeadm has already run successfully on this node
# and the init block is skipped entirely. Re-running kubeadm init on an
# already-initialised node is destructive — the guard prevents it.
#
# Post-init expected state (correct — not a failure):
#   Node:     NotReady  (no CNI; Cilium arrives in L2)
#   CoreDNS:  Pending   (same reason)
#   kube-proxy DaemonSet: absent (skipPhases: [addon/kube-proxy])
#   Control-plane static pods + etcd: Running

- name: "Kube_bootstrap | Check if control plane is already initialised"
  ansible.builtin.stat:
    path: "{{ kube_bootstrap_admin_conf }}"
  register: kube_bootstrap_admin_conf_stat

- name: "Kube_bootstrap | Render kubeadm init config"
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /tmp/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"
  when: not kube_bootstrap_admin_conf_stat.stat.exists

- name: "Kube_bootstrap | Run kubeadm init"
  ansible.builtin.command:
    cmd: kubeadm init --config /tmp/kubeadm-config.yaml
  register: kube_bootstrap_init_result
  changed_when: kube_bootstrap_init_result.rc == 0
  when: not kube_bootstrap_admin_conf_stat.stat.exists

- name: "Kube_bootstrap | Remove rendered init config (contains no secrets but keep disk clean)"
  ansible.builtin.file:
    path: /tmp/kubeadm-config.yaml
    state: absent
  when: not kube_bootstrap_admin_conf_stat.stat.exists

- name: "Kube_bootstrap | Print kubeadm init output"
  ansible.builtin.debug:
    var: kube_bootstrap_init_result.stdout_lines
  when:
    - not kube_bootstrap_admin_conf_stat.stat.exists
    - kube_bootstrap_init_result is not skipped
