# Note: kubeadm 1.29+ writes two kubeconfigs:
#   admin.conf       — bound to kubeadm:cluster-admins group (normal ops)
#   super-admin.conf — true cluster-admin (break-glass; keep locked down)
# This role copies admin.conf only.
