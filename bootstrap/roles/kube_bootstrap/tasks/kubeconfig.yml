---
# bootstrap/roles/kube_bootstrap/tasks/kubeconfig.yml
#
# Copies /etc/kubernetes/admin.conf to the Ansible remote user's ~/.kube/config.
#
# kubeadm 1.29+ writes two kubeconfigs:
#   admin.conf       — bound to kubeadm:cluster-admins group (normal ops use this)
#   super-admin.conf — true cluster-admin break-glass credential; keep locked down
# This task copies admin.conf only.
#
# Permissions: 0600, owned by the remote user. The file contains the cluster-admin
# credential; world-readable would be a security defect.

- name: "Kube_bootstrap | Ensure ~/.kube directory exists"
  ansible.builtin.file:
    path: "{{ kube_bootstrap_user_kubeconfig | dirname }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0700"

- name: "Kube_bootstrap | Copy admin.conf to user kubeconfig"
  ansible.builtin.copy:
    src: "{{ kube_bootstrap_admin_conf }}"
    dest: "{{ kube_bootstrap_user_kubeconfig }}"
    remote_src: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0600"
