---
# bootstrap/roles/kube_install/molecule/default/prepare.yml
#
# Ensures the Docker image has the prerequisites needed to add an apt
# repo (curl, gpg, apt-transport-https). The geerlingguy image is lean;
# these may be absent.

- name: Prepare
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Install apt transport prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true
