---
# bootstrap/roles/kube_install/molecule/default/converge.yml
#
# group_vars/all/versions.yml is NOT auto-loaded from this scenario directory,
# so it is loaded explicitly via vars_files (four ../ climb to bootstrap/).
# This provides the containerd.* and kubernetes.* blocks consumed by the
# dependency roles (os_prep, containerd) and kube_install itself.

- name: Converge
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../../../../group_vars/all/versions.yml

  pre_tasks:
    # ansible.builtin.deb822_repository (used by containerd role) requires
    # python3-debian on the target. The geerlingguy image does not ship it.
    - name: "Pre | Ensure python3-debian is present (deb822_repository dependency)"
      ansible.builtin.apt:
        name:
          - python3-debian
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

  vars:
    kube_install_prepull_images: false

  roles:
    - role: kube_install
