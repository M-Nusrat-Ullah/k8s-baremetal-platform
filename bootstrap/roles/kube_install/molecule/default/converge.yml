---
# bootstrap/roles/kube_install/molecule/default/converge.yml

- name: Converge
  hosts: all
  gather_facts: true
  become: true

  vars:
    kubernetes:
      version: "1.34.8-1.1"
      apt_repo: "https://pkgs.k8s.io/core:/stable:/v1.34/deb/"
      apt_signing_key: "https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key"
    kube_install_prepull_images: false

  roles:
    - role: kube_install
