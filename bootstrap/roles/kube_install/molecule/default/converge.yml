---
# bootstrap/roles/kube_install/molecule/default/converge.yml

- name: Converge
  hosts: all
  gather_facts: true
  become: true

  vars:
    kubernetes:
      # version pinned to a known-good value for CI; update when the repo
      # moves to a new patch. This must match what apt-cache madison reports.
      version: null # TODO: fill with pinned patch before first CI run
      apt_repo: "https://pkgs.k8s.io/core:/stable:/v1.34/deb/"
      apt_signing_key: "https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key"
    kube_install_prepull_images: false

  roles:
    - role: kube_install
